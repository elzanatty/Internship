<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Media Internship — Application</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F2F6FC;
    --ink:#0F2A4A;
    --purple:#8FB8F0;
    --purple-deep:#2C6FD9;
    --yellow:#BFDBFA;
    --green:#5FA8E8;
    --coral:#1B4E8F;
    --card:#FFFFFF;
    --line:#0F2A4A;
    --radius:22px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'DM Sans', sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:32px 16px 64px;
  }
  .wrap{
    width:100%;
    max-width:640px;
  }

  /* Header */
  .hero{
    text-align:center;
    margin-bottom:28px;
  }
  .kicker{
    font-family:'DM Mono', monospace;
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--purple-deep);
    margin-bottom:10px;
  }
  h1{
    font-family:'Baloo 2', cursive;
    font-weight:800;
    font-size:38px;
    line-height:1.05;
    margin:0 0 10px;
    -webkit-text-stroke:1.5px var(--ink);
    text-stroke:1.5px var(--ink);
  }
  .sub{
    font-size:15px;
    color:#4A4436;
    max-width:440px;
    margin:0 auto;
  }

  /* Progress trail */
  .trail{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin:26px 0 30px;
  }
  .dot{
    width:11px;height:11px;border-radius:50%;
    background:#EADFC6;
    border:2px solid var(--ink);
    transition:background .25s, transform .25s;
  }
  .dot.active{ background:var(--yellow); transform:scale(1.25); }
  .dot.done{ background:var(--green); }
  .trail-line{ width:22px; height:2px; background:#D9CCAA; }

  /* Card */
  .card{
    background:var(--card);
    border:2px solid var(--ink);
    border-radius:var(--radius);
    padding:30px 28px;
    box-shadow:6px 6px 0 var(--ink);
    position:relative;
    overflow:hidden;
  }
  .step-label{
    font-family:'DM Mono', monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--purple-deep);
    margin-bottom:6px;
  }
  .step-title{
    font-family:'Baloo 2', cursive;
    font-weight:700;
    font-size:24px;
    margin:0 0 18px;
  }

  label{
    display:block;
    font-weight:600;
    font-size:13.5px;
    margin:16px 0 6px;
  }
  label.first{ margin-top:0; }
  input[type=text], input[type=email], input[type=tel], textarea, select{
    width:100%;
    padding:11px 13px;
    border:2px solid var(--ink);
    border-radius:12px;
    font-family:'DM Sans', sans-serif;
    font-size:14.5px;
    background:#fff;
    color:var(--ink);
    outline:none;
    transition:box-shadow .15s;
  }
  input:focus, textarea:focus, select:focus{
    box-shadow:0 0 0 3px rgba(139,110,221,0.35);
  }
  textarea{ resize:vertical; min-height:70px; }
  .hint{ font-size:12px; color:#8A8060; margin-top:5px; }

  .chip-group{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    padding:8px 14px;
    border:2px solid var(--ink);
    border-radius:999px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    background:#fff;
    user-select:none;
    transition:background .15s, transform .1s;
  }
  .chip:hover{ transform:translateY(-1px); }
  .chip.selected{ background:var(--yellow); }

  .radio-row{ display:flex; gap:10px; }
  .radio-pill{
    flex:1;
    text-align:center;
    padding:10px;
    border:2px solid var(--ink);
    border-radius:12px;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    background:#fff;
  }
  .radio-pill.selected{ background:var(--green); }

  /* Buttons */
  .actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:26px;
  }
  button{
    font-family:'DM Sans', sans-serif;
    font-weight:700;
    font-size:14.5px;
    border:2px solid var(--ink);
    border-radius:999px;
    padding:11px 22px;
    cursor:pointer;
    background:var(--ink);
    color:var(--cream);
    transition:transform .12s;
  }
  button:hover{ transform:translateY(-2px); }
  button.ghost{
    background:transparent;
    color:var(--ink);
  }
  button:disabled{
    opacity:.4;
    cursor:not-allowed;
    transform:none;
  }

  /* Puzzle section */
  .puzzle-meter{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
    font-family:'DM Mono', monospace;
    font-size:12px;
  }
  .meter-track{
    flex:1;
    height:10px;
    border:2px solid var(--ink);
    border-radius:999px;
    background:#fff;
    overflow:hidden;
  }
  .meter-fill{
    height:100%;
    background:linear-gradient(90deg, var(--yellow), var(--green));
    width:0%;
    transition:width .3s;
  }
  .timer{
    font-family:'DM Mono', monospace;
    font-weight:600;
    color:var(--coral);
  }
  .q-block{ margin-bottom:6px; }
  .q-text{
    font-family:'Baloo 2', cursive;
    font-size:19px;
    font-weight:700;
    margin-bottom:16px;
    line-height:1.3;
  }
  .opt{
    display:block;
    width:100%;
    text-align:right;
    padding:12px 14px;
    margin-bottom:10px;
    border:2px solid var(--ink);
    border-radius:12px;
    background:#fff;
    color:var(--ink);
    font-family:'DM Sans', sans-serif;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
  }
  .opt:hover{ background:var(--cream); }
  .opt.correct{ background:var(--green); color:#fff; }
  .opt.wrong{ background:var(--coral); color:#fff; }
  .opt:disabled{ cursor:default; }

  /* Result screen */
  .result-badge{
    text-align:center;
    padding:20px 10px;
  }
  .brain-emoji{ font-size:56px; margin-bottom:8px; }
  .score-big{
    font-family:'Baloo 2', cursive;
    font-size:44px;
    font-weight:800;
    color:var(--purple-deep);
  }
  .badge-title{
    font-weight:700;
    font-size:16px;
    margin-top:6px;
  }

  .final-check{
    display:flex;
    align-items:flex-start;
    gap:10px;
    background:#F5EEDC;
    border:2px solid var(--ink);
    border-radius:14px;
    padding:14px;
    margin-top:18px;
    font-size:13px;
  }

  .success-wrap{ text-align:center; padding:20px 6px 6px; }
  .success-wrap .brain-emoji{ font-size:60px; }
  .success-title{
    font-family:'Baloo 2', cursive;
    font-size:26px;
    font-weight:800;
    margin:6px 0 8px;
  }

  .error-text{ color:var(--coral); font-size:12.5px; margin-top:4px; font-weight:600; display:none; }

  @media (max-width:480px){
    h1{ font-size:30px; }
    .card{ padding:24px 18px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="kicker">From Strategy to Execution</div>
    <h1>Before Day 1</h1>
    <p class="sub">A quick form to get to know you — plus a short brain warm-up, just for fun (and for us).</p>
  </div>

  <div class="trail" id="trail"></div>

  <div class="card" id="cardArea"></div>

</div>

<script>
const STEPS = ["Basics", "Experience", "Brain Warm-Up", "Review"];
let step = 0;

const state = {
  name:"", email:"", phone:"", university:"", gradYear:"",
  platforms:[], experience:"", experienceDetail:"", portfolio:"", whyJoin:"",
  puzzleAnswers:[], puzzleScore:0
};

const PUZZLES = [
  { q:"إدارة حساب سوشيال ميديا باحترافية بتشمل إيه؟",
    options:["بس النشر بشكل يومي","بحث، تخطيط، استراتيجية، أفكار، محتوى، نشر، تفاعل، تحليل، تطوير","تصميم الشعار بس","الرد على الكومنتات فقط"],
    correct:1 },
  { q:"مهمة الـ Social Media Specialist الأساسية إيه؟",
    options:["ينشر المحتوى بس","يفهم البراند والجمهور والسوق، ويحول الأهداف لأفكار ومحتوى وتحليل","يصمم الجرافيك فقط","يرد على الرسايل بس"],
    correct:1 },
  { q:"قبل ما تعمل أي محتوى، أول سؤال المفروض تسأله إيه؟",
    options:["هعمل فيديو ولا صورة؟","إحنا بنتكلم باسم مين؟ (إيه البراند وجمهوره)","هنستخدم فلتر إيه؟","هننشر الساعة كام؟"],
    correct:1 },
  { q:"تعريف الجمهور المستهدف بطريقة صح بيكون إزاي؟",
    options:["البنات من 18 لـ 35 سنة","كل الناس المهتمين بالمنتج","بنت عمرها 24، مهتمة بالعناية بالبشرة، بتدور على TikTok قبل الشراء، بتحب الـ Reviews","أي حد عنده فلوس"],
    correct:2 },
  { q:"لو عميل قال 'ممكن المنتج ده يناسبني'، هو في أنهي مرحلة من رحلة العميل؟",
    options:["Awareness","Consideration","Conversion","Loyalty"],
    correct:1 },
  { q:"أي نوع محتوى الأنسب لمرحلة الـ Loyalty؟",
    options:["محتوى تعليمي وترفيهي عام","مقارنة بين المنتجات","UGC، تقدير للعملاء، عروض خاصة","عروض وCTA واضح للشراء الأول"],
    correct:2 },
  { q:"الـ Content Pillars هي إيه بالظبط؟",
    options:["أسماء الحملات الإعلانية","الموضوعات الأساسية اللي البراند بيتكلم عنها باستمرار","الألوان الرسمية للبراند","أدوات جدولة المحتوى"],
    correct:1 },
  { q:"براند قهوة عايز يحفز الناس على الشراء دلوقتي، أنهي فكرة محتوى أنسب؟",
    options:["3 علامات تقولك إن قهوتك مش معمولة صح","قهوة سادة ولا بلبن؟","جرب قهوتك المفضلة بخصم 20% اليوم","تاريخ القهوة حول العالم"],
    correct:2 },
  { q:"منصة TikTok مناسبة أكتر لأنهي نوع محتوى؟",
    options:["Short-form video, trends, authentic content","Real-time conversations وآراء","المحتوى اليومي العفوي القريب من الجمهور بس","Community building طويل المدى بس"],
    correct:0 },
  { q:"أهم قاعدة في كتابة الـ Hook هي إيه؟",
    options:["ابدأ بالمعلومة مباشرة","ابدأ بسبب يخلي الشخص مهتم يعرف المعلومة","استخدم أطول جملة ممكنة","ابدأ بشكر المتابعين"],
    correct:1 },
  { q:"الهدف الحقيقي من تحليل المنافسين إيه؟",
    options:["ننسخ أفكارهم الناجحة","نفهم السوق، ونعمل حاجة مختلفة بناءً على الفهم ده","نعرف عدد متابعينهم بس","نتجاهلهم تمامًا"],
    correct:1 },
  { q:"Reel حقق 100K Views، هل ده معناه تلقائيًا إنه ناجح؟",
    options:["أيوه، أي رقم عالي يبقى نجاح","لأ، لازم نسأل هل حقق الهدف اللي اتعمل عشانه","لأ، لازم يكون فيه أكتر من مليون Views","أيوه، طالما مفيش كومنتات سلبية"],
    correct:1 },
  { q:"استكمل التسلسل: 2, 6, 12, 20, 30, ؟",
    options:["36","40","42","44"],
    correct:2 },
  { q:"عند فلاح 17 خروف. كل الخرفان هربت غير 9. كام خروف فاضل؟",
    options:["8","17","9","0"],
    correct:2 },
  { q:"لو MONDAY اتكتبت NPOEBZ (كل حرف +1)، إزاي هتتكتب TUESDAY؟",
    options:["UVFTEBZ","UVFTFAZ","UVFTFBZ","UWFTEBZ"],
    correct:2 }
];

let puzzleIndex = 0;
let timeLeft = 25;
let timerInterval = null;

function renderTrail(){
  const trail = document.getElementById('trail');
  trail.innerHTML = "";
  STEPS.forEach((s,i)=>{
    const dot = document.createElement('div');
    dot.className = 'dot' + (i===step ? ' active' : (i<step ? ' done':''));
    trail.appendChild(dot);
    if(i < STEPS.length-1){
      const line = document.createElement('div');
      line.className='trail-line';
      trail.appendChild(line);
    }
  });
}

function toggleChip(el, val){
  const idx = state.platforms.indexOf(val);
  if(idx>-1){ state.platforms.splice(idx,1); el.classList.remove('selected'); }
  else { state.platforms.push(val); el.classList.add('selected'); }
}

function selectPill(group, val, field){
  state[field] = val;
  document.querySelectorAll('.'+group).forEach(p=>p.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  if(field==='experience'){
    document.getElementById('expDetailWrap').style.display = (val==='yes') ? 'block':'none';
  }
}

function renderStep0(){
  const card = document.getElementById('cardArea');
  card.innerHTML = `
    <div class="step-label">Step 1 of 4</div>
    <div class="step-title">The Basics</div>

    <label class="first">Full name</label>
    <input type="text" id="f_name" value="${state.name}" placeholder="e.g. Sara Ahmed">

    <label>Email</label>
    <input type="email" id="f_email" value="${state.email}" placeholder="you@email.com">

    <label>Phone number</label>
    <input type="tel" id="f_phone" value="${state.phone}" placeholder="+20 1xx xxx xxxx">

    <label>University / Faculty</label>
    <input type="text" id="f_uni" value="${state.university}" placeholder="e.g. Mansoura University, Business">

    <label>Graduation year (or expected)</label>
    <input type="text" id="f_grad" value="${state.gradYear}" placeholder="e.g. 2026">

    <div class="error-text" id="err0">Please fill in your name, email and phone before continuing.</div>

    <div class="actions">
      <div></div>
      <button onclick="nextFrom0()">Next →</button>
    </div>
  `;
}

function nextFrom0(){
  state.name = document.getElementById('f_name').value.trim();
  state.email = document.getElementById('f_email').value.trim();
  state.phone = document.getElementById('f_phone').value.trim();
  state.university = document.getElementById('f_uni').value.trim();
  state.gradYear = document.getElementById('f_grad').value.trim();
  if(!state.name || !state.email || !state.phone){
    document.getElementById('err0').style.display='block';
    return;
  }
  step = 1; render();
}

function renderStep1(){
  const card = document.getElementById('cardArea');
  card.innerHTML = `
    <div class="step-label">Step 2 of 4</div>
    <div class="step-title">Your Experience</div>

    <label class="first">Which platforms do you use most?</label>
    <div class="chip-group" id="platformChips"></div>

    <label>Have you managed a social media account before (personal, business, or freelance)?</label>
    <div class="radio-row">
      <div class="radio-pill exp-pill" onclick="selectPill('exp-pill','yes','experience')">Yes</div>
      <div class="radio-pill exp-pill" onclick="selectPill('exp-pill','no','experience')">No</div>
    </div>

    <div id="expDetailWrap" style="display:none;">
      <label>Tell us briefly about it</label>
      <textarea id="f_expDetail" placeholder="What account, what did you do, roughly how long?">${state.experienceDetail}</textarea>
    </div>

    <label>Portfolio / Instagram / TikTok link (optional)</label>
    <input type="text" id="f_portfolio" value="${state.portfolio}" placeholder="Paste a link">

    <label>Why do you want to join this internship?</label>
    <textarea id="f_why" placeholder="A few sentences is plenty">${state.whyJoin}</textarea>

    <div class="actions">
      <button class="ghost" onclick="step=0; render();">← Back</button>
      <button onclick="nextFrom1()">Next →</button>
    </div>
  `;
  const platforms = ["Instagram","TikTok","Facebook","LinkedIn","X (Twitter)","Other"];
  const chipWrap = document.getElementById('platformChips');
  platforms.forEach(p=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (state.platforms.includes(p) ? ' selected':'');
    chip.textContent = p;
    chip.onclick = ()=>toggleChip(chip,p);
    chipWrap.appendChild(chip);
  });
  if(state.experience){
    document.querySelectorAll('.exp-pill').forEach(el=>{
      if(el.textContent.toLowerCase()===state.experience) el.classList.add('selected');
    });
    if(state.experience==='yes') document.getElementById('expDetailWrap').style.display='block';
  }
}

function nextFrom1(){
  state.experienceDetail = document.getElementById('f_expDetail') ? document.getElementById('f_expDetail').value.trim() : "";
  state.portfolio = document.getElementById('f_portfolio').value.trim();
  state.whyJoin = document.getElementById('f_why').value.trim();
  step = 2;
  puzzleIndex = 0;
  state.puzzleAnswers = [];
  state.puzzleScore = 0;
  render();
}

function renderStep2(){
  clearInterval(timerInterval);
  const card = document.getElementById('cardArea');

  if(puzzleIndex >= PUZZLES.length){
    renderPuzzleResult();
    return;
  }

  const p = PUZZLES[puzzleIndex];
  timeLeft = 60;

  card.innerHTML = `
    <div class="step-label">Step 3 of 4 — Screening Quiz (${puzzleIndex+1}/${PUZZLES.length})</div>
    <div class="puzzle-meter">
      <div class="meter-track"><div class="meter-fill" id="meterFill" style="width:${(puzzleIndex/PUZZLES.length)*100}%"></div></div>
      <div class="timer" id="timerText">${timeLeft}s</div>
    </div>
    <div class="q-block" dir="rtl">
      <div class="q-text">${p.q}</div>
      <div id="optsWrap"></div>
    </div>
  `;
  const optsWrap = document.getElementById('optsWrap');
  p.options.forEach((opt,i)=>{
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = opt;
    btn.onclick = ()=>answerPuzzle(i);
    optsWrap.appendChild(btn);
  });

  timerInterval = setInterval(()=>{
    timeLeft--;
    const t = document.getElementById('timerText');
    if(t) t.textContent = timeLeft+'s';
    if(timeLeft<=0){
      clearInterval(timerInterval);
      answerPuzzle(-1);
    }
  },1000);
}

function answerPuzzle(choiceIdx){
  clearInterval(timerInterval);
  const p = PUZZLES[puzzleIndex];
  const opts = document.querySelectorAll('.opt');
  opts.forEach((o,i)=>{
    o.disabled = true;
    if(i===p.correct) o.classList.add('correct');
    else if(i===choiceIdx) o.classList.add('wrong');
  });
  const isCorrect = choiceIdx === p.correct;
  if(isCorrect) state.puzzleScore++;
  state.puzzleAnswers.push({q:p.q, chosen: choiceIdx>=0 ? p.options[choiceIdx] : "(no answer)", correct:isCorrect});

  setTimeout(()=>{
    puzzleIndex++;
    renderStep2();
  }, 900);
}

function renderPuzzleResult(){
  const card = document.getElementById('cardArea');
  const score = state.puzzleScore;
  const total = PUZZLES.length;
  let emoji = "🧠", title = "Nice work!";
  if(score>=13){ emoji="🚀"; title="Sharp thinker!"; }
  else if(score>=10){ emoji="✨"; title="Solid instincts!"; }
  else if(score>=6){ emoji="🙂"; title="Good effort!"; }
  else { emoji="🌱"; title="Just getting started!"; }

  card.innerHTML = `
    <div class="step-label">Step 3 of 4 — Screening Quiz</div>
    <div class="result-badge">
      <div class="brain-emoji">${emoji}</div>
      <div class="score-big">${score}/${total}</div>
      <div class="badge-title">${title}</div>
    </div>
    <p class="hint" style="text-align:center;">Mix of social media knowledge + logic questions — helps us get to know how you think.</p>
    <div class="actions">
      <div></div>
      <button onclick="step=3; render();">Next →</button>
    </div>
  `;
}

function renderStep3(){
  const card = document.getElementById('cardArea');
  card.innerHTML = `
    <div class="step-label">Step 4 of 4</div>
    <div class="step-title">Review & Submit</div>

    <div class="final-check">
      <div>
        <strong>${state.name}</strong><br>
        ${state.email} · ${state.phone}<br>
        ${state.university || "—"} ${state.gradYear ? "· "+state.gradYear : ""}<br>
        Platforms: ${state.platforms.length ? state.platforms.join(', ') : "—"}<br>
        Prior experience: ${state.experience === 'yes' ? 'Yes' : (state.experience==='no' ? 'No' : "—")}<br>
        Screening quiz score: ${state.puzzleScore}/${PUZZLES.length}
      </div>
    </div>

    <p class="hint" style="margin-top:14px;">Double check your name, email and phone are correct — we'll use these to reach you.</p>

    <div class="actions">
      <button class="ghost" onclick="step=2; puzzleIndex=PUZZLES.length; render();">← Back</button>
      <button onclick="submitForm()" id="submitBtn">Submit Application 🎉</button>
    </div>
  `;
}

async function submitForm(){
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = "Submitting...";
  
  const record = {
    name: state.name,
    email: state.email,
    phone: state.phone,
    university: state.university,
    gradYear: state.gradYear,
    platforms: state.platforms,
    experience: state.experience,
    experienceDetail: state.experienceDetail,
    portfolio: state.portfolio,
    whyJoin: state.whyJoin,
    puzzleScore: state.puzzleScore
  };

  // IMPORTANT: Replace this string with the URL you generated in Google Apps Script
  const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwb0yar_vSBhQSH6dAr7lOB0SzuixNRsMreNJvUan6JMrLnVXzG994ifdz-Beru5f5hWQ/exec'; 

  try {
    await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors', // <--- This prevents the browser from blocking the Google redirect
      headers: {
        'Content-Type': 'text/plain', 
      },
      body: JSON.stringify(record)
    });
    renderSuccess();
  } catch(e) {
    console.error('Submission error', e);
    btn.disabled = false;
    btn.textContent = "Submit Application 🎉";
    alert("Something went wrong. Please try again.");
  }
}

function renderSuccess(){
  const card = document.getElementById('cardArea');
  card.innerHTML = `
    <div class="success-wrap">
      <div class="brain-emoji">🎉</div>
      <div class="success-title">You're in the pile!</div>
      <p class="sub" style="margin:0 auto;">Thanks, ${state.name.split(' ')[0] || 'there'} — we've got your application. We'll reach out on ${state.email} before Session 1.</p>
    </div>
  `;
}

function render(){
  renderTrail();
  if(step===0) renderStep0();
  else if(step===1) renderStep1();
  else if(step===2) renderStep2();
  else if(step===3) renderStep3();
}

render();
</script>
